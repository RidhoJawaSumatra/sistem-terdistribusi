<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - Website Dummy</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #333;
        }

        nav {
            background: #2563eb;
            padding: 15px 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .profile {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,.08);
            text-align: center;
        }

        .avatar {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
        }

        h1 {
            color: #2563eb;
            margin-bottom: 10px;
        }

        .info {
            margin-top: 30px;
            text-align: left;
        }

        .info p {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .info strong {
            display: inline-block;
            width: 120px;
        }

        footer {
            margin-top: 60px;
            padding: 20px;
            text-align: center;
            background: #1e293b;
            color: white;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Beranda</a>
        <a href="profil.html">Profil</a>
        <a href="jadwal.html">Jadwal</a>
    </nav>

    <main class="container">
        <section class="profile">
            <div class="avatar">JD</div>

            <h1>John Doe</h1>
            <p>Administrator / Pengguna</p>

            <div class="info">
                <p>
                    <strong>Nama</strong>
                    John Doe
                </p>

                <p>
                    <strong>Email</strong>
                    johndoe@example.com
                </p>

                <p>
                    <strong>No. Telepon</strong>
                    0812-3456-7890
                </p>

                <p>
                    <strong>Alamat</strong>
                    Subang, Jawa Barat
                </p>
            </div>
        </section>
    </main>

    <footer>
        &copy; 2026 Website Dummy
    </footer>

</body>
</html>
